<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>游戏人生 · 像素名人人生模拟</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 选人界面 -->
  <section id="start" class="show">
    <div class="logo"><span>游戏人生</span><small>PIXEL LIVES · 活一次名人的人生，然后改写它</small></div>
    <p class="intro">选择一位名人，从他人生的真实节点开始。走上像素街头，搭讪、谈判、坐私人飞机、乘邮轮、投资建厂……在关键节点做出和他不一样的选择，看看历史会被你改写成什么样。</p>
    <button id="continue" class="big-btn">▶ 继续上次的人生</button>
    <div id="celebs"></div>
    <p class="foot">人物经历来自公开报道，数值为游戏化简化，仅供娱乐。</p>
  </section>

  <!-- 游戏界面 -->
  <section id="game">
    <div id="hud"></div>
    <div id="stage">
      <canvas id="world" width="960" height="640"></canvas>
      <div id="toasts"></div>
      <div id="modal"></div>
    </div>
    <div id="bar">
      <button id="btn-skip" title="快进一个季度">⏩ 过一季度</button>
      <button id="btn-tl" title="T">📜 时间线</button>
      <button id="btn-car" title="C" style="display:none">🚗 上车</button>
      <button id="btn-save">💾 存档</button>
      <button id="btn-mute" title="M">🔊 声音</button>
      <button id="btn-menu">☰ 菜单</button>
      <span class="keys">WASD/方向键 移动 · E/空格 互动 · C 上下车 · T 时间线 · M 静音 · N 昼夜</span>
    </div>
    <div id="touch">
      <div class="dpad">
        <button data-k="ArrowUp" class="up">▲</button>
        <button data-k="ArrowLeft" class="left">◀</button>
        <button data-k="ArrowRight" class="right">▶</button>
        <button data-k="ArrowDown" class="down">▼</button>
      </div>
      <button id="btn-a" class="abtn">A</button>
    </div>
  </section>

  <script src="js/core.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/investments.js"></script>
  <script src="js/data/events.js"></script>
  <!-- 名人数据：每人一个文件，新增名人只需添加一行 -->
  <script src="js/data/celebs/rocketman.js"></script>
  <script src="js/data/celebs/gpuboss.js"></script>
  <script src="js/data/celebs/softking.js"></script>
  <script src="js/data/celebs/tower.js"></script>
  <script src="js/data/celebs/merchant.js"></script>
  <script src="js/data/celebs/freekick.js"></script>
  <script src="js/data/celebs/senator.js"></script>
  <script src="js/data/celebs/visionary.js"></script>
  <script src="js/engine/sprites.js"></script>
  <script src="js/engine/map.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
